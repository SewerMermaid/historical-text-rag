[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "american-history-rag"
version = "0.1.0"
description = "Citation-preserving multilingual hybrid RAG over historical texts"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "requests>=2.31", "sentence-transformers>=3.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
american-rag = "american_history_rag.cli:main"
history-rag = "american_history_rag.cli:main"

[tool.setuptools.packages.find]
where = ["databases/america/scripts"]
